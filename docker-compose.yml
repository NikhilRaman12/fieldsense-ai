services:
  fastapi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-mock_client_id}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-mock_client_secret}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-mock_webhook_id}
      - PAYPAL_ENV=sandbox
    volumes:
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - fastapi-backend
